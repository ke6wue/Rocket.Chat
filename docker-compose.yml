services:
  rocketchat:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-k12-chat:v1.0
    restart: always
    environment:
      - PORT=3000
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://mongodb:27017/local?replicaSet=rs0
      - ADMIN_USERNAME=admin
      - ADMIN_PASS=ChangeThisSecurePassword
      - ADMIN_EMAIL=admin@yourdistrict.org
    depends_on:
      - mongodb
    ports:
      - "3000:3000"

  mongodb:
    image: mongo:6.0
    restart: always
    volumes:
      - mongodb_data:/data/db
    command: mongod --oplogSize 128 --replicaSet rs0

volumes:
  mongodb_data:
    driver: local
