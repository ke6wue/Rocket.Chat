services:
  rocketchat:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-k12-chat:v1.0
    restart: on-failure
    environment:
      - PORT=3000
      - ROOT_URL=${ROOT_URL:-http://localhost:3000}
      - MONGO_URL=mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://mongodb:27017/local?replicaSet=rs0
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASS=${ADMIN_PASS:?Set ADMIN_PASS in your .env file}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@yourdistrict.org}
      - DEPLOY_METHOD=docker
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - rocketchat_uploads:/app/uploads

  mongodb:
    image: mongo:6.0
    restart: always
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--oplogSize", "128"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # One-shot job: initializes the replica set exactly once, then exits.
  # Without this, MONGO_URL's replicaSet=rs0 param means the driver waits
  # forever for a PRIMARY that will never be elected.
  # NOTE: idempotency is handled by catching rs.initiate()'s own
  # "already initialized" error, not by pre-checking rs.status() — the
  # latter can throw for reasons unrelated to "already initialized"
  # (e.g. right after container restart) and mask what's actually going on.
  mongo-init-replica:
    image: mongo:6.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh mongodb://mongodb:27017/rocketchat --quiet --eval
      '
      try {
        rs.initiate({ _id: "rs0", members: [ { _id: 0, host: "mongodb:27017" } ] });
        print("Replica set initiated");
      } catch (e) {
        if (e.codeName === "AlreadyInitialized" || /already initialized/i.test(e.message)) {
          print("Replica set already initialized - nothing to do");
        } else {
          print("ERROR initializing replica set: " + e);
          quit(1);
        }
      }
      '

volumes:
  mongodb_data:
    driver: local
  rocketchat_uploads:
    driver: local
